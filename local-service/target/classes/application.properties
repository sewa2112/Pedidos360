# ============================================
# CONFIGURACION LOCAL-SERVICE (RESTAURANTE / COCINA)
# ============================================
spring.application.name=local-service
server.port=8082

# ============================================
# BASE DE DATOS (H2 en memoria con persistencia opcional MySQL)
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:localesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# CONFIGURACION CENTRALIZADA DE RABBITMQ
# ============================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=/

# Listener manual ACK y prefetch
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=2

# ============================================
# CONFIGURACION CENTRALIZADA DE APACHE KAFKA (STREAMING CONSUMERS)
# ============================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.pedidos360=INFO
logging.level.org.springframework.amqp=INFO
