spring:
  application:
    name: order-processor-dlq
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:}
    password: ${SPRING_RABBITMQ_PASSWORD:}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          # Los reintentos (max 3) son controlados explicitamente por OrderConsumer
          # mediante basicNack(requeue=true) antes de derivar al DLX con requeue=false.
          enabled: false

server:
  port: 8081
