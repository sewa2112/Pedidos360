# Configuración de NGINX para Angular SPA + HTTPS + proxy al backend

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name _;

    # Permite health checks en HTTP y redirige el resto a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS
server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL (autogenerados en el Dockerfile)
    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos con caché
    location ~* \.(js|css|ico|png|jpg|jpeg|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy inverso hacia el backend Spring Boot
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Todas las rutas no encontradas redirigen a index.html (Angular SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
