spring.application.name=Pedidos360
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

# ============================================
# CONFIGURACION DE BASE DE DATOS
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://pedidos-360.cr846626okq7.us-east-1.rds.amazonaws.com:3306/pedidos360}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=4

# Puerto del microservicio de pedidos
server.port=8085

# Habilitar integracion con Azure AD
spring.cloud.azure.active-directory.enabled=true

# Tenant ID de Microsoft Entra ID
spring.cloud.azure.active-directory.profile.tenant-id=ac6019c7-78df-4d97-9d85-291001476eb0

# Client ID del registro del API en Entra ID (Pedidos360-Backend-Angular)
spring.cloud.azure.active-directory.credential.client-id=f900a1e2-036a-485f-b14f-c22a1ccf7005

# Application ID URI configurado en "Expose an API"
spring.cloud.azure.active-directory.app-id-uri=api://f900a1e2-036a-485f-b14f-c22a1ccf7005

# ============================================
# CONFIGURACION CENTRALIZADA DE RABBITMQ
# ============================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:}}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:}}
spring.rabbitmq.virtual-host=/

# ============================================
# CONFIGURACION CENTRALIZADA DE APACHE KAFKA (STREAMING)
# ============================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.properties.retry.backoff.ms=1000
