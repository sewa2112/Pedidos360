# Configuracion aislada de pruebas para pedidos360-backend (H2 en memoria, sin secretos)
spring.datasource.url=jdbc:h2:mem:pedidos360test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar llamadas externas a Entra ID, RabbitMQ y Kafka durante pruebas unitarias/contexto
spring.autoconfigure.exclude=com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration
spring.cloud.azure.active-directory.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.kafka.listener.auto-startup=false
spring.kafka.bootstrap-servers=localhost:9092
