# Configuracion aislada de pruebas para pedidos360-backend (H2 en memoria, sin secretos)
spring.datasource.url=jdbc:h2:mem:pedidos360test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar llamadas externas a Entra ID y RabbitMQ durante pruebas unitarias/contexto
spring.cloud.azure.active-directory.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
