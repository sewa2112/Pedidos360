services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: pedidos360-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${SPRING_RABBITMQ_USERNAME:-guest}
      - RABBITMQ_DEFAULT_PASS=${SPRING_RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - pedidos360-network

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: pedidos360-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    networks:
      - pedidos360-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pedidos360-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
    networks:
      - pedidos360-network

  backend:
    build:
      context: ./pedidos360-backend
      dockerfile: Dockerfile
    container_name: pedidos360-backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://pedidos-360.cr846626okq7.us-east-1.rds.amazonaws.com:3306/pedidos360}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-admin}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-ContrasenaMaestra}
      - SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_PROFILE_TENANT_ID=${AZURE_TENANT_ID:-ac6019c7-78df-4d97-9d85-291001476eb0}
      - SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_CREDENTIAL_CLIENT_ID=${AZURE_BACKEND_CLIENT_ID:-f900a1e2-036a-485f-b14f-c22a1ccf7005}
      - SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_APP_ID_URI=${AZURE_APP_ID_URI:-api://f900a1e2-036a-485f-b14f-c22a1ccf7005}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:-guest}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:-guest}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - SERVER_PORT=8085
    depends_on:
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - pedidos360-network

  local-service:
    build:
      context: ./local-service
      dockerfile: Dockerfile
    container_name: pedidos360-local-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:-guest}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:-guest}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - SERVER_PORT=8082
    depends_on:
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - pedidos360-network

  order-processor-dlq:
    build:
      context: ./order-processor-dlq
      dockerfile: Dockerfile
    container_name: pedidos360-order-processor
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:-guest}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:-guest}
      - SERVER_PORT=8081
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - pedidos360-network

  rabbitmq-avanzado:
    build:
      context: ./rabbitmq-avanzado
      dockerfile: Dockerfile
    container_name: pedidos360-rabbitmq-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:-guest}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:-guest}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:19092
      - SERVER_PORT=8080
    depends_on:
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - pedidos360-network

  logging-system:
    build:
      context: ./logging-system
      dockerfile: Dockerfile
    container_name: pedidos360-logging-system
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:-guest}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:-guest}
      - SERVER_PORT=8083
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - pedidos360-network

  frontend:
    build:
      context: ./pedidos360-frontend
      dockerfile: Dockerfile
    container_name: pedidos360-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - pedidos360-network

networks:
  pedidos360-network:
    driver: bridge
