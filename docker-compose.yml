services:
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: pedidos360-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${SPRING_RABBITMQ_USERNAME:?Defina SPRING_RABBITMQ_USERNAME en .env}
      - RABBITMQ_DEFAULT_PASS=${SPRING_RABBITMQ_PASSWORD:?Defina SPRING_RABBITMQ_PASSWORD en .env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pedidos360-network

  backend:
    build:
      context: ./pedidos360-backend
      dockerfile: Dockerfile
    container_name: pedidos360-backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:?Defina SPRING_DATASOURCE_URL en .env}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:?Defina SPRING_DATASOURCE_USERNAME en .env}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Defina SPRING_DATASOURCE_PASSWORD en .env}
      - SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_PROFILE_TENANT_ID=${AZURE_TENANT_ID:-ac6019c7-78df-4d97-9d85-291001476eb0}
      - SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_CREDENTIAL_CLIENT_ID=${AZURE_BACKEND_CLIENT_ID:-f900a1e2-036a-485f-b14f-c22a1ccf7005}
      - SPRING_CLOUD_AZURE_ACTIVE_DIRECTORY_APP_ID_URI=${AZURE_APP_ID_URI:-api://f900a1e2-036a-485f-b14f-c22a1ccf7005}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:?Defina SPRING_RABBITMQ_USERNAME en .env}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:?Defina SPRING_RABBITMQ_PASSWORD en .env}
      - SERVER_PORT=8085
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-network

  local-service:
    build:
      context: ./local-service
      dockerfile: Dockerfile
    container_name: pedidos360-local-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:?Defina SPRING_RABBITMQ_USERNAME en .env}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:?Defina SPRING_RABBITMQ_PASSWORD en .env}
      - SERVER_PORT=8082
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-network

  order-processor-dlq:
    build:
      context: ./order-processor-dlq
      dockerfile: Dockerfile
    container_name: pedidos360-order-processor
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:?Defina SPRING_RABBITMQ_USERNAME en .env}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:?Defina SPRING_RABBITMQ_PASSWORD en .env}
      - SERVER_PORT=8081
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-network

  rabbitmq-avanzado:
    build:
      context: ./rabbitmq-avanzado
      dockerfile: Dockerfile
    container_name: pedidos360-rabbitmq-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:?Defina SPRING_RABBITMQ_USERNAME en .env}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:?Defina SPRING_RABBITMQ_PASSWORD en .env}
      - SERVER_PORT=8080
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-network

  logging-system:
    build:
      context: ./logging-system
      dockerfile: Dockerfile
    container_name: pedidos360-logging-system
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:?Defina SPRING_RABBITMQ_USERNAME en .env}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:?Defina SPRING_RABBITMQ_PASSWORD en .env}
      - SERVER_PORT=8083
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - pedidos360-network

  frontend:
    build:
      context: ./pedidos360-frontend
      dockerfile: Dockerfile
    container_name: pedidos360-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - pedidos360-network

networks:
  pedidos360-network:
    driver: bridge
