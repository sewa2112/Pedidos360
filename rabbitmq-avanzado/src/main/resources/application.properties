# ============================================
# CONFIGURACION DE LA APLICACION
# ============================================
spring.application.name=rabbitmq-avanzado
server.port=8080

# ============================================
# CONFIGURACION DE RABBITMQ
# ============================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}

# Configuracion de listeners
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=5

# ============================================
# CONFIGURACION DE LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.example=INFO
logging.level.org.springframework.amqp=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
